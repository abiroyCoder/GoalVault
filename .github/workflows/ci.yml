name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contract-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/skillstake-contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/skillstake-contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contract
        run: cargo build
        working-directory: contracts/skillstake-contract

      - name: Run contract tests
        run: cargo test --lib
        working-directory: contracts/skillstake-contract

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
